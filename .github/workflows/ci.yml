name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch, JAX, and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install "jax[cpu]>=0.4.30" "optax>=0.2.2"
          pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit tests
        run: pytest -q

      - name: Run CPU end-to-end smoke pipeline
        run: bash scripts/smoke_cpu.sh
